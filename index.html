<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Briefing de design editorial</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff8ed;--field:#ffffff;--line:#93accf;--q:#3b220d;--a:#000000;--serif:'Times New Roman',Times,serif;--sans:'Hanken Grotesk',system-ui,sans-serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--q);font:17px/1.55 var(--sans)}
.wrap{max-width:1040px;margin:0 auto;padding:32px 20px 80px;display:grid;grid-template-columns:230px 1fr;gap:56px}
nav{position:sticky;top:32px;align-self:start}
nav b{font:400 24px/1.1 var(--serif);display:block;margin-bottom:22px}
nav ol{list-style:none;margin:0;padding:0;border-left:2px solid var(--line)}
nav li button{all:unset;display:block;cursor:default;padding:7px 0 7px 16px;margin-left:-2px;border-left:2px solid transparent;font-size:15px;opacity:.55}
nav li.on button{opacity:1;font-weight:600;border-left-color:var(--q)}
nav li.ok button{opacity:.85;cursor:pointer}
nav li.ok button:hover{text-decoration:underline}
.top{display:none}
h1,h2{font-family:var(--serif);font-weight:400;margin:0;line-height:1.05}
h1{font-size:clamp(44px,7vw,72px);margin-bottom:16px}
h2{font-size:clamp(32px,4.5vw,44px);margin-bottom:8px}
.lead{font-size:19px;max-width:56ch;margin:0 0 30px}
h3{font:400 28px/1.15 var(--serif);margin:38px 0 4px}
.note{margin:0 0 18px;font-style:italic;opacity:.85}
.sub{border-left:3px solid var(--line);padding-left:20px;margin-left:2px}
.q{margin:0 0 24px;animation:in .25s ease}
.q[hidden],.sec[hidden]{display:none}
@keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1}}
@media(prefers-reduced-motion:reduce){.q{animation:none}html{scroll-behavior:auto}}
label.l,.l{display:block;font-weight:600;margin-bottom:4px;color:var(--q)}
.l i{font-style:normal;color:var(--q);margin-left:3px}
.h{font-size:14.5px;margin:0 0 8px;opacity:.8}
input[type=text],input[type=email],input[type=tel],input[type=date],select,textarea{width:100%;background:var(--field);color:var(--a);border:1.5px solid var(--line);border-radius:6px;padding:12px 14px;font:inherit}
textarea{min-height:112px;resize:vertical}
input::placeholder,textarea::placeholder{color:#6b5b4c}
:focus-visible{outline:2px solid var(--q);outline-offset:2px}
.opts{display:grid;gap:8px}
.opt{display:flex;gap:12px;align-items:flex-start;background:var(--field);color:var(--a);border:1.5px solid var(--line);border-radius:6px;padding:11px 14px;cursor:pointer}
.opt:has(input:checked){border-color:var(--q);box-shadow:inset 0 0 0 1px var(--q)}
.opt:has(input:disabled){opacity:.5;cursor:not-allowed}
.opt input{accent-color:var(--q);margin-top:5px;width:17px;height:17px;flex:none}
.opt small{display:block;opacity:.7}
.cols{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.file{background:var(--field);border:1.5px dashed var(--line);border-radius:6px;padding:16px;color:var(--a)}
.file ul{list-style:none;margin:10px 0 0;padding:0}
.file li{display:flex;justify-content:space-between;gap:10px;font-size:15px;padding:4px 0}
.file li button{all:unset;cursor:pointer;text-decoration:underline;color:var(--q)}
.err{color:#8a1c12;font-size:14.5px;margin:6px 0 0;font-weight:500}
.btn{font:600 16px var(--sans);border-radius:6px;padding:13px 26px;border:1.5px solid var(--q);cursor:pointer;background:var(--q);color:var(--bg)}
.btn.s{background:transparent;color:var(--q);border-color:var(--line)}
.btn:disabled{opacity:.6;cursor:wait}
.bar{display:flex;justify-content:space-between;gap:12px;margin-top:36px;padding-top:22px;border-top:1.5px solid var(--line)}
.rv{background:var(--field);border:1.5px solid var(--line);border-radius:6px;padding:6px 20px;margin-bottom:16px;color:var(--a)}
.rv h4{font:400 24px var(--serif);margin:14px 0 4px;color:var(--q);display:flex;justify-content:space-between;align-items:baseline}
.rv h4 button{all:unset;cursor:pointer;font:500 14px var(--sans);text-decoration:underline}
.rv p{margin:0;padding:8px 0;border-top:1px solid #e6edf5;font-size:15.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.rv p span{display:block;color:var(--q);font-weight:600;font-size:14px}
.msg{padding:14px 16px;border:1.5px solid var(--line);background:var(--field);border-radius:6px;margin-top:16px;color:var(--a)}
.panel[hidden]{display:none}
#pa{display:none}
@media(max-width:820px){
.wrap{grid-template-columns:1fr;gap:0;padding-top:16px}
nav{display:none}
.top{display:block;position:sticky;top:0;background:var(--bg);padding:10px 0;margin-bottom:18px;z-index:5;font-size:14.5px;font-weight:600}
.top div{height:5px;background:#fff;border:1px solid var(--line);border-radius:4px;margin-top:6px}
.top div i{display:block;height:100%;background:var(--q);border-radius:3px;transition:width .3s}
}
@media print{body>*{display:none!important}body>#pa{display:block!important;color:#000;background:#fff}#pa p{margin:4px 0}}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<div class="wrap">
<nav aria-label="Etapas"><b>Briefing de design editorial</b><ol id="rail"></ol></nav>
<main>
<div class="top" id="top"></div>
<form id="f" novalidate></form>
</main>
</div>
<div id="pa"></div>

<script>
/* ====== CONFIGURAÇÃO ======
   1) Troque pelo SEU e-mail. Na primeira vez que alguém enviar, o FormSubmit manda um e-mail
      de ativação para este endereço: clique no link e pronto.
   2) A página precisa estar hospedada (não funciona abrindo o arquivo direto no computador). */
const EMAIL_DESTINO = "hericamaiade.araujo@gmail.com";
const LIMITE_ANEXOS_MB = 20;
const STORE = "briefing_editorial_v1";

/* ====== PERGUNTAS ====== */
const has=(v,x)=>Array.isArray(v)&&v.includes(x);
const any=(v,l)=>l.some(x=>has(v,x));
const CAPA=["Criação de capa","Redesign de capa","Projeto editorial completo (capa e miolo)"];
const EDIT=["Diagramação de livro impresso","Diagramação de e-book","Diagramação de revista","Diagramação de catálogo","Projeto editorial completo (capa e miolo)","Adaptação de material existente","Outro serviço"];
const isP=a=>a.q10==="Impresso"||a.q10==="Impresso e digital";
const isD=a=>a.q10==="Digital"||a.q10==="Impresso e digital";
const SN=["Sim","Não"], ND="Não sei / a definir";
const Q=(n,label,type,o={})=>({id:"q"+String(n).padStart(2,"0"),n,label,type,...o});
const STEPS=[
{t:"Vamos começar pelo básico",i:"Quem está por trás do projeto e que tipo de trabalho você procura?",secs:[
 {t:"Seus dados",d:"Estas respostas ajudam a compreender o escopo. Tudo será enviado automaticamente ao final.",qs:[
  Q(1,"Seu nome completo","text",{r:1,p:"Nome e sobrenome"}),
  Q(2,"E-mail principal","email",{r:1,p:"voce@exemplo.com"}),
  Q(3,"Cidade e estado","text",{r:1,p:"Ex.: Goiânia, GO"}),
  Q(4,"WhatsApp","tel",{r:1,p:"(00) 00000-0000"}),
  Q(5,"Instagram","text",{p:"@perfil (opcional)"}),
  Q(6,"Site","url",{p:"https:// (opcional)"})]},
 {t:"O que você procura?",d:"Marque todos os serviços que podem fazer parte deste projeto.",qs:[
  Q(7,"Serviço desejado","multi",{r:1,o:["Criação de capa","Redesign de capa","Diagramação de livro impresso","Diagramação de e-book","Diagramação de revista","Diagramação de catálogo","Projeto editorial completo (capa e miolo)","Adaptação de material existente","Outro serviço"]}),
  Q(8,"Conte um pouco mais sobre o serviço","long",{r:1,p:"O que você gostaria de criar ou adaptar?",s:a=>has(a.q07,"Outro serviço")}),
  Q(9,"O que já existe e o que precisa ser adaptado?","long",{r:1,p:"Conte sobre o material atual, o que deve ser mantido e o que precisa mudar.",s:a=>has(a.q07,"Adaptação de material existente")}),
  Q(10,"Como o material será publicado?","single",{r:1,o:[["Impresso","Livro, revista, catálogo ou outra peça física."],["Digital","E-book, PDF ou publicação para tela."],["Impresso e digital","Vamos detalhar cada versão separadamente."]]})]}]},
{t:"A ideia por trás do projeto",i:"Um pouco de contexto ajuda a criar uma solução que faça sentido para quem vai ler, usar ou receber o material.",secs:[
 {t:"Objetivo e contexto",qs:[
  Q(11,"O que você pretende criar ou resolver com este projeto?","long",{r:1,p:"Descreva o projeto, o conteúdo e o que você espera desenvolver."}),
  Q(12,"Há um lançamento, evento ou situação relacionada?","long",{r:1,p:"Conte o contexto e, se houver, a data."}),
  Q(13,"Como você saberá que o projeto deu certo?","long",{r:1,p:"Descreva o que representaria sucesso para você e suas expectativas do que vai receber."})]},
 {t:"Público",d:"Não é preciso construir uma persona. Uma descrição simples já ajuda bastante.",qs:[
  Q(14,"Quem é o público principal? Quem vai ler, comprar, usar ou receber o material?","long",{r:1,p:"Se quem compra e quem lê forem pessoas diferentes, conte também."}),
  Q(15,"O que esse público precisa entender, sentir ou fazer depois do contato com o projeto?","long",{r:1,p:"Pense na experiência e na mensagem principal."}),
  Q(16,"Há características importantes a considerar?","long",{r:1,p:"Faixa etária, idioma, região, hábitos, acessibilidade, familiaridade com o tema ou outras."})]}]},
{t:"Conteúdo e materiais",i:"Aqui entendemos o volume, a estrutura e o que já está pronto para o projeto.",secs:[
 {t:"Sobre o conteúdo",qs:[
  Q(17,"Título do projeto","text",{r:1,p:"Pode ser provisório"}),
  Q(18,"Subtítulo","text",{p:"Se houver"}),
  Q(19,"Autoria e créditos","text",{r:1,p:"Autor(a), organizador(a), tradutor(a), ilustrador(a) etc."}),
  Q(20,"Gênero, assunto ou categoria","text",{r:1,p:"Ex.: ficção, educação, catálogo institucional"}),
  Q(21,"Em que estágio está o conteúdo?","single",{r:1,o:["Finalizado e revisado","Em revisão","Ainda está sendo escrito/produzido","O conteúdo ainda não começou"],s:a=>any(a.q07,EDIT)}),
  Q(22,"Qual é o volume aproximado?","text",{r:1,p:"Ex.: 180 páginas, 45 mil palavras, 60 produtos",s:a=>any(a.q07,EDIT)}),
  Q(23,"Em quais idiomas será publicado? Haverá traduções ou versões?","text",{r:1,p:"Ex.: português; português e inglês"}),
  Q(24,"Quais informações precisam obrigatoriamente aparecer?","multi",{h:"Marque o que se aplica e acrescente dados específicos no campo que aparecer.",o:["ISBN ou código de barras","Ficha catalográfica","Créditos e direitos autorais","Dados da editora","Preço","Contatos, endereços ou redes sociais","Texto de contracapa ou apresentação","Outras informações"]}),
  Q(25,"Quais dados ou informações?","long",{s:a=>has(a.q24,"Outras informações")})]},
 {t:"Texto e informações da capa",d:"Títulos e textos provisórios também ajudam a prever o escopo.",sub:1,show:a=>any(a.q07,CAPA),qs:[
  Q(26,"Os textos que devem aparecer na capa já estão definidos?","single",{r:1,o:["Sim, estão definidos","Ainda estão sendo preparados"]})]},
 {t:"Materiais disponíveis",d:"Selecione o que já pode ser disponibilizado.",qs:[
  Q(27,"O que você já possui?","multi",{o:["Logotipo ou identidade visual","Paleta de cores/manual da marca","Fotografias","Ilustrações","Arquivos editáveis","Imagens/fontes com licença de uso","ISBN ou ficha catalográfica","Dados da editora","Contatos ou redes sociais","Texto de contracapa ou apresentação","Outros materiais"]}),
  Q(28,"Quais outros materiais?","text",{s:a=>has(a.q27,"Outros materiais")}),
  Q(29,"Seus arquivos (opcional)","file",{h:"Anexe imagens e arquivos de referência.",acc:".pdf,.indd,.ai,.eps,.svg,.png,.jpg,.jpeg,.zip",s:a=>(a.q27||[]).length>0}),
  Q(30,"Há materiais ainda pendentes?","single",{r:1,o:SN}),
  Q(31,"O que falta e quando você espera conseguir enviar?","long",{r:1,p:"Liste os materiais e uma previsão, se possível.",s:a=>a.q30==="Sim"})]}]},
{t:"Como o material vai ganhar forma",i:"Responda apenas aos blocos que aparecerem. Em projetos com versão impressa e digital, cada uma é especificada separadamente, mesmo que alguns dados sejam iguais.",secs:[
 {t:"Versão impressa",d:"Informe o que já estiver definido. Sem as especificações? Escolha “não sei / a definir”.",sub:1,show:isP,qs:[
  Q(32,"Dimensões finais","text",{r:1,p:"Largura × altura, ex.: 16 × 23 cm; ou “a definir”"}),
  Q(33,"Impressão em cores","select",{r:1,o:["Colorida","Preto e branco","Mista",ND]}),
  Q(34,"Encadernação","select",{r:1,o:["Brochura","Capa dura","Grampeado","Espiral","Outra",ND]}),
  Q(35,"Já existe uma gráfica ou editora definida?","single",{r:1,o:SN}),
  Q(36,"Qual é a gráfica/editora?","text",{r:1,p:"Nome e número para contato",s:a=>a.q35==="Sim"}),
  Q(37,"Você recebeu especificações técnicas da gráfica (sangria, perfil de cor, gabarito etc.)?","single",{r:1,o:SN}),
  Q(38,"Link ou observações sobre as especificações","long",{s:a=>a.q37==="Sim"}),
  Q(39,"Arquivo de especificações","file",{acc:".pdf,.jpg,.jpeg,.png,.zip,.ai,.eps,.indd,.idml",s:a=>a.q37==="Sim"}),
  Q(40,"Acabamentos especiais","multi",{r:1,o:["Laminação","Verniz","Relevo","Corte especial","Nenhum","Outro"]}),
  Q(41,"Qual acabamento?","text",{s:a=>has(a.q40,"Outro")})]},
 {t:"Versão digital",d:"Os formatos dependem da plataforma e do modo de leitura. Se não souber, escreva “a definir”.",sub:1,show:isD,qs:[
  Q(42,"Qual a plataforma de publicação?","long",{r:1,p:"Ex.: Amazon Kindle, Apple Books, site próprio, plataforma institucional; inclua links."}),
  Q(43,"Quais formatos finais você precisa?","multi",{r:1,o:["PDF para leitura digital","Imagens de capa/páginas ou peças específicas","PNG (ícones e imagens que requerem transparência)","JPEG (imagens ricas em detalhes)"]}),
  Q(44,"Será necessário adaptar o material para mais de uma plataforma?","single",{r:1,o:SN}),
  Q(45,"Quais plataformas ou adaptações?","long",{r:1,p:"Liste as plataformas e o que precisa mudar em cada versão.",s:a=>a.q44==="Sim"})]}]},
{t:"Direção visual e referências",i:"Conte as sensações e referências que ajudam a imaginar o caminho certo.",secs:[
 {t:"A linguagem do projeto",qs:[
  Q(46,"Quais características você gostaria que o projeto transmitisse?","multi",{r:1,max:3,h:"Escolha até três e indique apenas o que realmente importa.",cols:1,o:["Elegante","Sofisticado","Moderno","Criativo","Minimalista","Acolhedor","Profissional","Artesanal","Delicado","Forte","Ousado","Divertido","Tradicional","Vintage","Premium","Inovador","Outro"]}),
  Q(47,"Qual característica?","text",{s:a=>has(a.q46,"Outro")}),
  Q(48,"O que o projeto NÃO deve transmitir?","long",{r:1,p:"Pense em sensações, estilos, cores, símbolos ou clichês a evitar."}),
  Q(49,"Há cores desejadas, obrigatórias ou que devem ser evitadas?","long",{r:1,p:"Ex.: tons terrosos e azul-marinho; evitar vermelho."})]},
 {t:"Referências e posicionamento",qs:[
  Q(50,"Você já possui referências visuais?","single",{r:1,o:SN}),
  Q(51,"Links de referências","long",{p:"Cole links de livros, revistas, sites ou outros projetos.",s:a=>a.q50==="Sim"}),
  Q(52,"Imagens de referência (opcional)","file",{h:"Anexe as imagens de referência.",acc:".jpg,.jpeg,.png,.pdf",s:a=>a.q50==="Sim"}),
  Q(53,"O que exatamente você gosta em cada referência?","long",{p:"Cores, composição, estilo, sensação, tipografia ou outro aspecto.",s:a=>a.q50==="Sim"}),
  Q(54,"Há projetos semelhantes ou referências da categoria que devemos observar?","long",{r:1,p:"Inclua links e diga, se souber, o que funciona ou não neles."}),
  Q(55,"Em relação a esses projetos, o que deve ser familiar e em que o seu deve se diferenciar?","long",{p:"As referências orientam o caminho; não serão copiadas."})]}]},
{t:"Entregas, prazos e aprovação",i:"Combinamos o que você precisa receber, as datas importantes e quem dará o aceite final.",secs:[
 {t:"Arquivos finais",d:"Escolha os arquivos para cada versão selecionada.",qs:[
  Q(56,"Arquivos da versão impressa","multi",{r:1,o:["JPG para impressão","PDF preparado para impressão","Capa/arte final para produção gráfica"],s:isP}),
  Q(57,"Arquivos da versão digital","multi",{r:1,o:["PDF para leitura digital","EPUB","Capa em JPG/PNG para divulgação"],s:isD}),
  Q(58,"Arquivos adicionais (opcional)","multi",{o:["Arquivo-fonte/editável (a combinar)","Peças para divulgação","Outro"]}),
  Q(59,"Quais outros arquivos ou entregáveis?","text",{s:a=>has(a.q58,"Outro")}),
  Q(60,"Qual arquivo editável ou material-fonte?","long",{p:"A entrega de arquivos-fonte pode depender do escopo contratado.",s:a=>has(a.q58,"Arquivo-fonte/editável (a combinar)")}),
  Q(61,"Quais peças de divulgação, em que quantidade e para quais canais?","long",{p:"Ex.: 3 formatos para Instagram e 1 banner para o site.",s:a=>has(a.q58,"Peças para divulgação")})]},
 {t:"Cronograma e aprovação",qs:[
  Q(62,"Qual é a data desejada para a entrega?","date",{r:1}),
  Q(63,"Existe uma data-limite inadiável?","single",{r:1,o:SN}),
  Q(64,"Qual é a data-limite e por que ela é inadiável?","long",{r:1,p:"Informe a data e o contexto (evento, lançamento etc.).",s:a=>a.q63==="Sim"}),
  Q(65,"Quem será responsável pela aprovação final?","text",{r:1,p:"Nome e papel no projeto"}),
  Q(66,"Há algo que possa atrasar o envio de textos, imagens ou aprovações?","long",{r:1,p:"Dependências externas, revisão interna, material de terceiros etc."}),
  Q(67,"Há uma faixa de investimento prevista? (opcional)","text",{p:"Ajuda a adequar o escopo e os entregáveis."}),
  Q(68,"Existe alguma informação importante que você gostaria de acrescentar?","long",{p:"Campo opcional"})]}]}
];
const ALLQ=STEPS.flatMap(s=>s.secs.flatMap(c=>c.qs));

/* ====== ESTADO ====== */
let A={}, FILES={}, cur=0, maxStep=0, done=null, doneMode=false;
try{const s=JSON.parse(localStorage.getItem(STORE)||"null");if(s){A=s.A||{};cur=s.cur||0;maxStep=s.maxStep||0}}catch(e){}
const save=()=>{try{localStorage.setItem(STORE,JSON.stringify({A,cur,maxStep}))}catch(e){}};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const secOn=c=>!c.show||c.show(A);
const qOn=(q,c)=>secOn(c)&&(!q.s||q.s(A));
const empty=(q)=>q.type==="file"?!(FILES[q.id]||[]).length:Array.isArray(A[q.id])?!A[q.id].length:!String(A[q.id]||"").trim();
const val=q=>q.type==="file"?((FILES[q.id]||[]).length||!doneMode?(FILES[q.id]||[]).map(f=>f.name):(A["_fn_"+q.id]||[])).join(", "):Array.isArray(A[q.id])?A[q.id].join(", "):String(A[q.id]||"").trim();

/* ====== RENDER ====== */
const F=$("#f");
function field(q){
  const id=q.id,ph=q.p?` placeholder="${esc(q.p)}"`:"";
  if(q.type==="long")return`<textarea id="${id}" name="${id}"${ph}></textarea>`;
  if(q.type==="select")return`<select id="${id}" name="${id}"><option value="">Selecione</option>${q.o.map(o=>`<option>${esc(o)}</option>`).join("")}</select>`;
  if(q.type==="single"||q.type==="multi"){
    const t=q.type==="single"?"radio":"checkbox";
    return`<div class="opts${q.cols?" cols":""}" role="group" aria-labelledby="l-${id}">${q.o.map(o=>{const[v,d]=Array.isArray(o)?o:[o];return`<label class="opt"><input type="${t}" name="${id}" value="${esc(v)}"><span>${esc(v)}${d?`<small>${esc(d)}</small>`:""}</span></label>`}).join("")}</div>`}
  if(q.type==="file")return`<div class="file"><input type="file" id="${id}" multiple accept="${q.acc}"><ul id="fl-${id}"></ul><div class="h" style="margin:8px 0 0">Aceitos: ${q.acc.replaceAll(",",", ")}</div></div>`;
  const t=q.type==="url"?"text":q.type;
  return`<input type="${t}" id="${id}" name="${id}"${ph}${q.type==="url"?' inputmode="url"':""}${q.type==="tel"?' inputmode="tel" autocomplete="tel"':""}${q.type==="email"?' autocomplete="email"':""}>`;
}
F.innerHTML=STEPS.map((s,i)=>`<section class="panel" data-s="${i}" hidden>
 ${i===0?`<h1>Vamos entender o projeto por <em>inteiro.</em></h1><p class="lead">Este briefing ajuda a reunir as informações necessárias para criar uma solução editorial coerente com seu conteúdo, seu público e seus objetivos.</p>`:`<h2>${esc(s.t)}</h2><p class="lead">${esc(s.i)}</p>`}
 ${i===0?`<h2>${esc(s.t)}</h2><p class="lead">${esc(s.i)}</p>`:""}
 ${s.secs.map((c,k)=>`<div class="sec${c.sub?" sub":""}" data-c="${i}-${k}"><h3>${esc(c.t)}</h3>${c.d?`<p class="note">${esc(c.d)}</p>`:""}
  ${c.qs.map(q=>`<div class="q" data-q="${q.id}"><${q.type==="single"||q.type==="multi"?"div":"label"} class="l" id="l-${q.id}" ${q.type==="single"||q.type==="multi"?"":`for="${q.id}"`}>${esc(q.label)}${q.r?"<i aria-hidden='true'>*</i>":""}</${q.type==="single"||q.type==="multi"?"div":"label"}>${q.h?`<p class="h">${esc(q.h)}</p>`:""}${field(q)}<p class="err" hidden role="alert"></p></div>`).join("")}</div>`).join("")}
 <div class="bar">${i>0?`<button type="button" class="btn s" data-back>Voltar</button>`:"<span></span>"}<button type="button" class="btn" data-next>${i<STEPS.length-1?"Continuar":"Revisar respostas"}</button></div></section>`).join("")
 +`<section class="panel" data-s="${STEPS.length}" hidden><h2>Revise e envie</h2><p class="lead">Confira suas respostas. Se algo estiver errado, volte à etapa e corrija antes de enviar.</p><div id="rv"></div><div id="sm"></div><div class="bar"><button type="button" class="btn s" data-back>Voltar</button><button type="button" class="btn" id="send">Enviar briefing</button></div></section>
 <section class="panel" data-s="done" hidden><h2>Briefing enviado</h2><p class="lead">Obrigado! Recebemos todas as suas respostas e anexos e entraremos em contato em breve.</p><p id="srv" class="note"></p><div style="display:flex;gap:12px;flex-wrap:wrap"><button type="button" class="btn s" id="dl">Baixar PDF</button><button type="button" class="btn s" id="pr">Imprimir / salvar em PDF</button><button type="button" class="btn" id="nw">Iniciar novo briefing</button></div></section>`;

/* restaura valores */
ALLQ.forEach(q=>{const v=A[q.id];if(v==null||q.type==="file")return;
  F.querySelectorAll(`[name="${q.id}"]`).forEach(el=>{if(el.type==="radio")el.checked=el.value===v;else if(el.type==="checkbox")el.checked=has(v,el.value);else el.value=v})});

const names=[...STEPS.map(s=>s.t),"Revisar e enviar"];
function refresh(){
  STEPS.forEach((s,i)=>s.secs.forEach((c,k)=>{
    const on=secOn(c),el=F.querySelector(`[data-c="${i}-${k}"]`);el.hidden=!on;
    c.qs.forEach(q=>{const e=F.querySelector(`[data-q="${q.id}"]`);e.hidden=!qOn(q,c)});
  }));
  ALLQ.filter(q=>q.max).forEach(q=>{const n=(A[q.id]||[]).length;F.querySelectorAll(`[name="${q.id}"]`).forEach(el=>el.disabled=!el.checked&&n>=q.max)});
  FILES&&ALLQ.filter(q=>q.type==="file").forEach(q=>{A["_fn_"+q.id]=(FILES[q.id]||[]).map(f=>f.name);$("#fl-"+q.id).innerHTML=(FILES[q.id]||[]).map((f,i)=>`<li><span>${esc(f.name)} (${(f.size/1048576).toFixed(1)} MB)</span><button type="button" data-rm="${q.id}:${i}">remover</button></li>`).join("")});
}
function show(n){
  cur=n;maxStep=Math.max(maxStep,n);
  F.querySelectorAll(".panel").forEach(p=>p.hidden=p.dataset.s!=String(n));
  const last=n===STEPS.length;
  $("#rail").innerHTML=names.map((t,i)=>`<li class="${i===n?"on":i<=maxStep?"ok":""}"><button type="button" ${i<=maxStep&&i!==n?`data-go="${i}"`:""} ${i===n?'aria-current="step"':""}>${i+1}. ${esc(t)}</button></li>`).join("");
  $("#top").innerHTML=`Etapa ${n+1} de ${names.length}: ${esc(names[n])}<div><i style="width:${(n+1)/names.length*100}%"></i></div>`;
  if(last)buildReview();
  refresh();save();window.scrollTo({top:0});
}

/* ====== VALIDAÇÃO ====== */
function validate(i){
  let first=null;
  STEPS[i].secs.forEach(c=>c.qs.forEach(q=>{
    const box=F.querySelector(`[data-q="${q.id}"]`),er=box.querySelector(".err");let m="";
    if(qOn(q,c)){
      if(q.r&&empty(q))m=q.type==="single"||q.type==="multi"||q.type==="select"?"Escolha uma opção.":"Preencha este campo.";
      else if(q.type==="email"&&!empty(q)&&!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(A[q.id]))m="Digite um e-mail válido, como voce@exemplo.com.";
      else if(q.type==="tel"&&!empty(q)&&String(A[q.id]).replace(/\D/g,"").length<10)m="Digite o número com DDD.";
    }
    er.textContent=m;er.hidden=!m;if(m&&!first)first=box;
  }));
  if(first){first.scrollIntoView({block:"center"});const f=first.querySelector("input,select,textarea");f&&f.focus({preventScroll:true})}
  return !first;
}

/* ====== RESUMO ====== */
function collect(){return STEPS.map((s,i)=>({t:s.t,items:s.secs.filter(secOn).flatMap(c=>c.qs.filter(q=>qOn(q,c)).map(q=>({q,v:val(q)})))}))}
function buildReview(){
  $("#rv").innerHTML=collect().map((g,i)=>`<div class="rv"><h4>${esc(g.t)}<button type="button" data-go="${i}">editar</button></h4>${g.items.map(x=>`<p><span>${esc(x.q.label)}</span>${esc(x.v||"—")}</p>`).join("")}</div>`).join("");
}
function asText(){return collect().map(g=>`== ${g.t.toUpperCase()} ==\n`+g.items.map(x=>`${x.q.n}. ${x.q.label}\n   ${x.v||"(não respondido)"}`).join("\n")).join("\n\n")}


/* ====== PDF ====== */
function makePDF(){
  const d=new window.jspdf.jsPDF({unit:"mm",format:"a4"}),M=18,W=210,mw=W-2*M;let y=M;
  const line=(txt,size,bold,color,lh)=>{d.setFont("times",bold?"bold":"normal");d.setFontSize(size);d.setTextColor(...color);
    d.splitTextToSize(String(txt),mw).forEach(l=>{if(y+lh>285){d.addPage();y=M}d.text(l,M,y);y+=lh})};
  line("Briefing de design editorial",22,1,[59,34,13],9);
  line("Enviado em "+new Date().toLocaleString("pt-BR"),10,0,[0,0,0],6);y+=4;
  collect().forEach(g=>{
    if(y>260){d.addPage();y=M}
    line(g.t,15,1,[59,34,13],7);d.setDrawColor(147,172,207);d.line(M,y-3,W-M,y-3);y+=2;
    g.items.forEach(x=>{if(y>270){d.addPage();y=M}
      line(x.q.label,10,1,[59,34,13],5);line(x.v||"-",11,0,[0,0,0],5.2);y+=3});
    y+=3});
  return d;
}

/* ====== EVENTOS ====== */
F.addEventListener("input",e=>{
  const el=e.target,id=el.name||el.id;if(!id||el.type==="file"||el.type==="checkbox"||el.type==="radio")return;
  if(el.type==="tel"){let d=el.value.replace(/\D/g,"").slice(0,11);el.value=d.length>6?`(${d.slice(0,2)}) ${d.slice(2,d.length>10?7:6)}-${d.slice(d.length>10?7:6)}`:d.length>2?`(${d.slice(0,2)}) ${d.slice(2)}`:d}
  A[id]=el.value;refresh();save();
});
F.addEventListener("focusout",e=>{const el=e.target;if(el.id==="q06"&&el.value.trim()&&!/^https?:\/\//i.test(el.value.trim())){el.value="https://"+el.value.trim();A.q06=el.value;save()}});
F.addEventListener("change",e=>{
  const el=e.target;
  if(el.type==="radio"){A[el.name]=el.value}
  else if(el.type==="checkbox"){
    if(el.name==="q40"&&el.checked){F.querySelectorAll(`[name="q40"]`).forEach(x=>{if(x!==el&&(el.value==="Nenhum"||x.value==="Nenhum"))x.checked=false})}
    A[el.name]=[...F.querySelectorAll(`[name="${el.name}"]:checked`)].map(x=>x.value)}
  else if(el.type==="file"){
    const q=ALLQ.find(x=>x.id===el.id),ok=q.acc.split(",");let bad=[];
    FILES[q.id]=FILES[q.id]||[];
    [...el.files].forEach(f=>{const x="."+f.name.split(".").pop().toLowerCase();if(!ok.includes(x))bad.push(f.name);else if(!FILES[q.id].some(g=>g.name===f.name&&g.size===f.size))FILES[q.id].push(f)});
    el.value="";if(bad.length)alert("Formato não aceito: "+bad.join(", ")+"\nAceitos: "+q.acc.replaceAll(",",", "));
  }else return;
  refresh();save();
});
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.rm){const[id,i]=b.dataset.rm.split(":");FILES[id].splice(+i,1);refresh()}
  else if(b.dataset.go!=null)show(+b.dataset.go);
  else if("next"in b.dataset){if(validate(cur))show(cur+1)}
  else if("back"in b.dataset)show(cur-1);
});
$("#send").onclick=send;
$("#dl").onclick=()=>{try{makePDF().save("briefing-editorial.pdf")}catch(e){alert("Não foi possível gerar o PDF agora. Use Imprimir / salvar em PDF.")}};
$("#pr").onclick=()=>{$("#pa").innerHTML="<h1>Briefing de design editorial</h1>"+esc(done).split("\n").map(l=>`<p>${l||"&nbsp;"}</p>`).join("");window.print()};
$("#nw").onclick=()=>{A={};FILES={};done=null;maxStep=0;ALLQ.forEach(q=>F.querySelectorAll(`[name="${q.id}"]`).forEach(el=>{el.type==="radio"||el.type==="checkbox"?el.checked=false:el.value=""}));show(0)};

/* ====== ENVIO PARA O E-MAIL ====== */
async function send(){
  for(let i=0;i<STEPS.length;i++){if(!validate(i)){show(i);validate(i);return}}
  const box=$("#sm"),btn=$("#send");box.innerHTML="";
  const fileList=collect().flatMap(g=>g.items).filter(x=>x.q.type==="file").flatMap(x=>(FILES[x.q.id]||[]).map(f=>({q:x.q,f})));
  const total=fileList.reduce((s,x)=>s+x.f.size,0);
  if(total>LIMITE_ANEXOS_MB*1048576){box.innerHTML=`<div class="msg">Os anexos somam ${(total/1048576).toFixed(1)} MB e o limite é ${LIMITE_ANEXOS_MB} MB. Remova ou compacte alguns arquivos (.zip) e tente de novo. Suas respostas continuam salvas.</div>`;return}
  if(EMAIL_DESTINO.startsWith("SEU-EMAIL")){box.innerHTML=`<div class="msg">Envio ainda não configurado: edite EMAIL_DESTINO no código da página.</div>`;return}
  const fd=new FormData(),pad=n=>String(n).padStart(2,"0");
  btn.disabled=true;btn.textContent="Enviando…";
  const slug=(A.q01||"cliente").normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase()||"cliente";
  fd.append("_subject","Novo briefing editorial: "+(A.q01||"cliente"));
  fd.append("_template","table");fd.append("_captcha","false");
  if(A.q02)fd.append("_replyto",A.q02);
  fd.append("_honey","");
  fd.append("Cliente",A.q01||"");fd.append("E-mail",A.q02||"");fd.append("WhatsApp",A.q04||"");
  fd.append("Resumo","Respostas completas no PDF anexo.");
  const nomes=[];
  try{fd.append("briefing_pdf",new File([makePDF().output("blob")],"briefing-"+slug+".pdf",{type:"application/pdf"}))}
  catch(e){fd.append("Aviso","Não foi possível gerar o PDF; respostas abaixo.");collect().forEach(g=>g.items.forEach(x=>{if(x.q.type!=="file")fd.append(`${pad(x.q.n)}. ${x.q.label}`,x.v||"(não respondido)")}))}
  const usados={};
  const fname=x=>{let n=`Pergunta-${pad(x.q.n)}_${x.f.name.replace(/[\\/:*?"<>|]/g,"_")}`;usados[n]=(usados[n]||0)+1;if(usados[n]>1)n=`Pergunta-${pad(x.q.n)}_${usados[n]}_${x.f.name.replace(/[\\/:*?"<>|]/g,"_")}`;nomes.push(n);return n};
  if(fileList.length){
    if(window.JSZip){
      const z=new JSZip();fileList.forEach(x=>z.file(fname(x),x.f));
      const blob=await z.generateAsync({type:"blob",compression:"STORE"});
      fd.append("imagens_zip",new File([blob],"imagens-"+slug+".zip",{type:"application/zip"}));
    }else fileList.forEach((x,i)=>{const n=fname(x);fd.append("anexo_"+(i+1),new File([x.f],n,{type:x.f.type}))});
  }
  fd.append("Arquivos enviados",nomes.join("; ")||"(nenhum)");
  fd.append("Enviado em",new Date().toLocaleString("pt-BR"));
  const fr=document.createElement("iframe");fr.name="envio_frame";fr.style.display="none";document.body.appendChild(fr);
  const form=document.createElement("form");form.method="POST";form.enctype="multipart/form-data";form.style.display="none";form.target="envio_frame";
  form.action="https://formsubmit.co/"+encodeURIComponent(EMAIL_DESTINO);
  for(const [k,v] of fd.entries()){
    const i=document.createElement("input");i.name=k;
    if(v instanceof File){i.type="file";const dt=new DataTransfer();dt.items.add(v);i.files=dt.files}
    else{i.type="hidden";i.value=v}
    form.appendChild(i);
  }
  document.body.appendChild(form);
  const fim=ok=>{clearTimeout(tm);fr.onload=null;form.remove();fr.remove();
    if(ok){done=asText();try{localStorage.removeItem(STORE)}catch(e){}
      F.querySelectorAll(".panel").forEach(p=>p.hidden=p.dataset.s!=="done");
      $("#rail").innerHTML="";$("#top").innerHTML="";window.scrollTo({top:0})}
    else box.innerHTML=`<div class="msg">Não foi possível confirmar o envio. Suas respostas continuam salvas nesta página: confira a conexão e tente novamente.</div>`;
    btn.disabled=false;btn.textContent="Enviar briefing"};
  const tm=setTimeout(()=>fim(false),120000);
  form.submit();
  fr.onload=()=>fim(true);
  return;
  btn.disabled=false;btn.textContent="Enviar briefing";
}

if(/[?&]enviado=1/.test(location.search)){
  doneMode=true;done=asText();try{localStorage.removeItem(STORE)}catch(e){}
  history.replaceState(null,"",location.pathname);
  F.querySelectorAll(".panel").forEach(p=>p.hidden=p.dataset.s!=="done");
}else show(Math.min(cur,STEPS.length));
</script>
</body>
</html>
